<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intressen Mac Flink</title>
    <meta
      name="description"
      content="Läs om Mac Flinks intressen vid sidan av arbetet som Tai Chi-instruktör."
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!--Imports the header-->
    <header id="site-header"></header>

    <main class="interests">
      <h1 class="interests__heading">Intressen</h1>

      <section class="interests__section">
        <h2 class="interests__subheading">Mina intressen</h2>

        <article class="interest">
          <h3 class="interest__title">Naturvandring</h3>
          <p class="interest__description">
            Lugna promenader i skog och mark för återhämtning, andning och
            fokus.
          </p>
        </article>

        <article class="interest">
          <h3 class="interest__title">Läsning & filosofi</h3>
          <p class="interest__description">
            Läser böcker om kroppskännedom, mental balans och hållbara
            livsvanor.
          </p>
        </article>

        <article class="interest">
          <h3 class="interest__title">Te & stillhet</h3>
          <p class="interest__description">
            En enkel kvällsrutin med grönt te och tid utan skärmar.
          </p>
        </article>
      </section>
    </main>

    <!--Imports the footer-->
    <footer class="footer" id="site-footer"></footer>
